name: release

# Validation runs on every push/PR to main. Publishing only happens for a
# signed v* tag, and only after validation passes.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate package (syntax + real C# core compile)
        shell: powershell
        run: .\.github\scripts\Validate-Package.ps1

      - name: Check package contents (allow-list, version, encoding)
        shell: powershell
        run: |
          $expected = if ($env:GITHUB_REF -like 'refs/tags/*') { $env:GITHUB_REF_NAME } else { '' }
          .\.github\scripts\Test-PackageContents.ps1 -ExpectedVersion $expected

  release:
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write      # create the GitHub Release
      id-token: write      # OIDC for build provenance
      attestations: write  # write the attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require the release tag to be signed by an approved key
        shell: bash
        run: |
          git config gpg.format ssh
          git config gpg.ssh.allowedSignersFile .github/allowed_signers
          git verify-tag "$GITHUB_REF_NAME"

      - name: Build the release ZIP from tracked source
        id: build
        shell: powershell
        run: .\.github\scripts\Build-Zip.ps1 -Version $env:GITHUB_REF_NAME

      - name: Attest build provenance for the exact ZIP
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.build.outputs.zip }}

      - name: Publish the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" "${{ steps.build.outputs.zip }}" \
            --title "WR FreeMouse $version" \
            --notes "Built and attested by GitHub Actions from the signed \`$GITHUB_REF_NAME\` tag. See the README section \"Verifying your download\" to check this release."
